<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Chat App</h1>

    <ul id="messages"></ul>
    <input type="text" placeholder="enter your name" id="username" />
    <button id="userBtn">Add userName</button>
    <div id="nickname"></div>
    <form id="form" action="">
      <input
        type="text"
        id="input"
        placeholder="Type message here"
        autocomplete="off"
      />
      <button>Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const messages = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const userName = document.getElementById("username");
      const addUserBtn = document.getElementById("userBtn");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = input.value;
        console.log(message);
        if (message) {
          socket.emit("chat message", message);
          input.value = " ";
        }
      });

      addUserBtn.addEventListener("click", () => {
        if (userName) {
          socket.emit("user name", userName.value);
          userName.value = socket.data.userName;
        }
      });

      socket.on("user name", (userName) => {
        const nickname = document.getElementById("nickname");
        item = document.createElement("h4");
        item.textContent = userName;
        nickname.appendChild(item);
      });
      socket.on("chat message", (msg) => {
        const item = document.createElement("li");
        item.textContent = msg;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });

      socket.on("user online", (msg) => {
        console.log(msg);
        showToast(`user ${msg}`);
      });

      const showToast = (message) => {
        let container = document.getElementById("toast-container");
        if (!container) {
          container = document.createElement("div");
          container.id = "toast-container";
          document.body.appendChild(container);
        }

        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerText = message;

        container.appendChild(toast);

        setTimeout(() => {
          toast.remove();
        }, 3000);
      };

      // showToast("here we ");
    </script>
  </body>
</html>
